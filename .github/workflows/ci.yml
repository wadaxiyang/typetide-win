name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branding:
    name: Brand consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy brand references
        shell: bash
        run: |
          if git grep -ni -E 'say[pP]ick|say[[:space:]]+pick' -- ':!AGENTS.md'; then
            echo "Legacy product name found; use TypeTide-Win everywhere."
            exit 1
          fi

  windows:
    name: Windows build + self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
        working-directory: windows
      - name: Build
        run: cmake --build build --config Release
        working-directory: windows
      - name: Self-test
        shell: pwsh
        run: |
          # GUI 子系统 exe：& 调用不等待、$LASTEXITCODE 不更新，必须 Start-Process -Wait
          $env:TYPETIDE_DATA_DIR = "$env:RUNNER_TEMP\typetide-win-ci"
          $p = Start-Process -FilePath windows\build\Release\TypeTide-Win.exe `
              -ArgumentList '--selftest' -WindowStyle Hidden -Wait -PassThru
          exit $p.ExitCode

      - name: Popup and provider routing regression tests
        run: ctest --test-dir windows/build -C Release --output-on-failure

      - name: Verify Windows version metadata
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not (Select-String -Quiet -Path windows/CMakeLists.txt -Pattern "project\(TypeTide-Win VERSION $([regex]::Escape($version)) ")) {
            throw "windows/CMakeLists.txt does not match VERSION=$version"
          }
          [xml]$manifest = Get-Content windows/src/TypeTide-Win.manifest -Raw
          if ($manifest.assembly.assemblyIdentity.version -ne "$version.0") {
            throw "Manifest version does not match VERSION"
          }
          $info = (Get-Item windows/build/Release/TypeTide-Win.exe).VersionInfo
          if ($info.ProductName -ne 'TypeTide-Win' -or $info.ProductVersion -ne $version) {
            throw "Executable branding/version does not match"
          }
          ./scripts/check-ui-quality.ps1
